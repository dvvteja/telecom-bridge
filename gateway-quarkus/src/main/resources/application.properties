# =============================================================================
# Telecom-Bridge Gateway — Quarkus + JDiameter
# =============================================================================

# ── HTTP Server ───────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ── Application Name ──────────────────────────────────────────────────────────
quarkus.application.name=telecom-bridge-quarkus
quarkus.application.version=1.0.0

# ── Diameter Configuration (overridable via env vars: DIAMETER_SERVER_HOST etc.) ──
diameter.server-host=${DIAMETER_HOST:localhost}
diameter.server-port=${DIAMETER_PORT:3868}
diameter.origin-host=gateway.telecombridge.local
diameter.origin-realm=telecombridge.local
diameter.destination-host=simulator.telecombridge.local
diameter.destination-realm=telecombridge.local
diameter.request-timeout-ms=5000
diameter.watchdog-interval-seconds=30
diameter.reconnect-delay-seconds=5

# ── SmallRye Health (HPA-ready probes) ────────────────────────────────────────
# /q/health       — combined
# /q/health/live  — liveness  (Kubernetes livenessProbe)
# /q/health/ready — readiness (Kubernetes readinessProbe)
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.ui.enable=true
quarkus.smallrye-health.ui.root-path=/q/health-ui

# ── Prometheus Metrics (/q/metrics) ───────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ── Management Endpoint (separate port for internal probes) ──────────────────
quarkus.management.enabled=true
quarkus.management.port=9000

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.telecombridge".level=DEBUG
quarkus.log.category."org.jdiameter".level=INFO
# Structured JSON logging for log aggregation pipelines (ELK/Loki)
quarkus.log.console.json=false

# ── JSON serialisation ────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.serialization-inclusion=non_null

# ── Shutdown ──────────────────────────────────────────────────────────────────
# Allow in-flight requests 5s to complete before shutdown
quarkus.shutdown.timeout=5S

# ── Thread pool (Quarkus worker pool for blocking calls) ─────────────────────
quarkus.thread-pool.core-threads=8
quarkus.thread-pool.max-threads=64

# =============================================================================
# Test profile overrides (%test prefix)
# =============================================================================
%test.quarkus.http.port=0
%test.diameter.server-host=localhost
%test.diameter.server-port=13868
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.telecombridge".level=DEBUG
