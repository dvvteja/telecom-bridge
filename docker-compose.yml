version: "3.9"

services:

  # ── Diameter Simulator ───────────────────────────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: telecom-bridge/simulator:1.0.0
    container_name: diameter-simulator
    ports:
      - "3868:3868"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3868"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - diameter-net
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  # ── REST Gateway ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: telecom-bridge/gateway:1.0.0
    container_name: telecom-gateway
    ports:
      - "8080:8080"
    environment:
      DIAMETER_HOST: simulator
      DIAMETER_PORT: "3868"
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Xss256k
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      simulator:
        condition: service_healthy
    networks:
      - diameter-net
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

networks:
  diameter-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
